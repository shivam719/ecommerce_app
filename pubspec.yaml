name: ecommerce_app
description: "A modern E-Commerce app with GetX and MVVM Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter_native_splash:
  color: "#673AB7"
  image: assets/images/logo.png
  branding: assets/images/branding.png
  color_dark: "#121212"
  image_dark: assets/images/logo.png
  branding_dark: assets/images/branding.png

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#673AB7"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#121212"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
